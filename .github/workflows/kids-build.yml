# Private build of this branch for one TV: the kids' launcher's "returnTo" change.
# Builds the regular app id (com.beb.plxnative) so it installs over the Homebrew Channel copy,
# keeping its sign-in and settings. No telemetry keys, no Sentry, nothing published:
# the .ipk is a run artifact to download and install by hand.
name: Kids TV build

on:
  push:
    branches: [launch-link-return-to, return-to-on-v0.9.0]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned Rust and the armv7 target
        uses: ./.github/actions/rust-toolchain

      - id: ndk
        uses: ./.github/actions/webos-ndk

      - name: Build + package
        env:
          WEBOS_SDK: ${{ steps.ndk.outputs.sdk-dir }}
          RELEASE: "1"
          FLAVOR: stable
        run: |
          make -j"$(nproc)"
          make ipk
          ls -la pkg/*.ipk

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plxnative-kids-tv
          path: pkg/*.ipk
          if-no-files-found: error
          retention-days: 30
